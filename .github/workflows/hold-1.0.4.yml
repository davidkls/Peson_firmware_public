name: Suspendre firmware v1.0.4 - boutons
on:
  push:
    paths:
      - '.github/workflows/hold-1.0.4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  suspend:
    runs-on: ubuntu-latest
    steps:
      - name: Retirer la 1.0.4 des mises a jour automatiques
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit v1.0.4 --prerelease
          gh release edit v1.0.3 --latest
          gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name' | grep -Fx 'v1.0.3'
